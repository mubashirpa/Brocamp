<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="icon" href="images/icon.svg" type="image/x-icon" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid p-0">
      <!-- Top appbar -->
      <nav class="navbar p-0" id="navbar">
        <div class="container-fluid p-0 d-flex flex-nowrap">
          <!-- Leading -->
          <div class="d-flex align-items-center">
            <div
              role="button"
              class="button d-none d-sm-flex justify-content-center align-items-center rounded-pill"
            >
              <img src="images/menu.svg" alt="Menu" />
            </div>

            <a class="navbar-brand d-flex align-items-center m-0" href="#">
              <img
                src="images/logo.svg"
                alt="YouTube"
                class="d-inline-block"
                id="navbar-brand-img"
              />
            </a>
          </div>

          <!-- Searchbar -->
          <div
            class="d-none d-md-flex flex-grow-1 align-items-center"
            id="navbar-searchbar-container"
          >
            <div
              class="d-flex flex-grow-1 align-items-center"
              id="navbar-searchbar"
            >
              <input
                type="text"
                placeholder="Search"
                id="searchbar-input-field"
              />

              <div
                role="button"
                class="d-flex justify-content-center align-items-center"
                id="searchbar-trailing"
              >
                <img src="images/search.svg" alt="Search" />
              </div>
            </div>

            <div
              role="button"
              class="button d-flex justify-content-center align-items-center rounded-pill me-2"
              id="seachbar-mic"
            >
              <img src="images/mic.svg" alt="Search with your voice" />
            </div>
          </div>

          <!-- Trialing -->
          <div
            class="d-flex justify-content-end align-items-center"
            id="navbar-trailing"
          >
            <div
              role="button"
              class="button d-flex d-md-none justify-content-center align-items-center rounded-pill"
            >
              <img src="images/search.svg" alt="Search" />
            </div>

            <div
              role="button"
              class="button d-none d-sm-flex d-md-none justify-content-center align-items-center rounded-pill"
            >
              <img src="images/mic.svg" alt="Search with your voice" />
            </div>

            <div
              role="button"
              class="button navbar-trailing-gap d-none d-sm-flex justify-content-center align-items-center rounded-pill"
            >
              <img src="images/create.svg" alt="Create" />
            </div>

            <div
              role="button"
              class="button navbar-trailing-gap d-none d-sm-flex justify-content-center align-items-center rounded-pill"
            >
              <img src="images/notifications.svg" alt="Notifications" />
            </div>

            <div
              role="button"
              class="button d-flex justify-content-center align-items-center rounded-pill"
              id="navbar-profile-button"
            >
              <img
                src="images/profile.jpg"
                alt="Profile"
                class="rounded-pill"
                id="navbar-profile-img"
              />
            </div>
          </div>
        </div>
      </nav>
    </div>

    <!-- Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
